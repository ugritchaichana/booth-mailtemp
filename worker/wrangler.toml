name = "capture-worker"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
send_metrics = false

[triggers]
crons = ["*/5 * * * *"]

[vars]
LAST_RESORT = "rethrow"
STATUS_URL = "https://mail.booth.pp.ua/api/status"

[[kv_namespaces]]
binding = "CAPTURE_FALLBACK"
id = "5b112b2f57b04c9fafcc4510dacd3755"

[[kv_namespaces]]
binding = "MONITOR_STATE"
id = "17ea44a78f754f0588ff2c44b8ee75c7"

[[services]]
binding = "CLOUD"
service = "mailtemp-cloud"

[observability]
enabled = true
