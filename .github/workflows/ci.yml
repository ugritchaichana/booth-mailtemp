name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            cloud/package-lock.json

      - name: Syntax check
        run: |
          find worker status-worker cloud tools \
            \( -name node_modules -o -name .wrangler -o -name dist \) -prune -o \
            \( -name '*.js' -o -name '*.mjs' \) -print0 |
            xargs -0 -n1 node --check

      - name: Status worker tests
        run: node --test "status-worker/test/*.test.js"

      - name: Capture worker tests
        run: node --test "worker/test/*.test.js"

      - name: Cloud unit tests
        run: node --test "cloud/test/*.test.mjs"

      - name: Capture worker bundle (dry run, no Cloudflare credentials)
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy --dry-run --outdir dist

      - name: Cloud worker bundle (dry run) and local integration
        working-directory: cloud
        run: |
          npm ci
          npx wrangler deploy --dry-run --outdir dist
          node test/integration.mjs

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/package-lock.json

      - name: Install dependencies and Chromium
        working-directory: cloud
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Cloud admin browser check
        working-directory: cloud
        run: node test/admin-browser.mjs
