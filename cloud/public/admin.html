<!doctype html>
<html lang="en" class="h-100">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="/vendor/mailpit.svg">
<title>Mailpit admin</title>
<script>
(() => {
  const dark = matchMedia("(prefers-color-scheme: dark)");
  const apply = () => document.documentElement.setAttribute("data-bs-theme", dark.matches ? "dark" : "light");
  dark.addEventListener("change", apply);
  apply();
})();
</script>
<link rel="stylesheet" href="/vendor/app.css">
<style>
#preview{width:100%;height:calc(100vh - 360px);min-height:320px;border:0;background:#fff}
.list-table th{position:sticky;top:0;z-index:2;background:var(--bs-body-bg)}
.list-table tbody tr[data-open]{cursor:pointer}
.cell-clip{max-width:22rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat-label{font-size:.75rem;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body class="h-100">
<div class="container-fluid h-100 d-flex flex-column">
  <div class="navbar row flex-shrink-0 bg-primary text-white d-print-none" data-bs-theme="dark">
    <div class="col"><span class="navbar-brand text-white me-0"><img src="/vendor/mailpit.svg" alt=""><span class="ms-2">Mailpit</span></span><span class="badge text-bg-light ms-2 align-middle">Admin</span></div>
    <div class="col-auto"><button id="logout" type="button" class="btn btn-outline-light d-none"><i class="bi bi-box-arrow-right me-1"></i>Sign out</button></div>
  </div>

  <main id="login" class="d-none flex-fill d-flex align-items-start justify-content-center pt-5">
    <form id="loginForm" class="card w-100" style="max-width:380px" novalidate>
      <div class="card-body">
        <h1 class="h5 mb-3">Admin sign in</h1>
        <label class="form-label small" for="password">Password</label>
        <input id="password" type="password" class="form-control mb-3" autocomplete="current-password" required>
        <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>
        <button id="loginGo" type="submit" class="btn btn-primary w-100">Sign in</button>
      </div>
    </form>
  </main>

  <main id="app" class="d-none flex-fill d-flex flex-column" style="min-height:0">
    <div id="listPane" class="d-flex flex-column flex-fill" style="min-height:0">
      <div id="stats" class="row g-2 py-3 flex-shrink-0" aria-label="Storage statistics"></div>
      <div class="d-flex flex-wrap align-items-center gap-2 pb-2 flex-shrink-0">
        <form id="searchForm" class="flex-grow-1" style="max-width:32rem">
          <div class="input-group">
            <input id="search" type="search" class="form-control" aria-label="Search" placeholder="Search recipient, sender or subject" autocomplete="off" maxlength="40">
            <button class="btn btn-outline-secondary" type="submit" aria-label="Search"><i class="bi bi-search"></i></button>
          </div>
        </form>
        <button id="refresh" type="button" class="btn btn-outline-secondary"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
        <button id="deleteSelected" type="button" class="btn btn-outline-danger" disabled><i class="bi bi-trash-fill me-1"></i>Delete selected<span id="selectedCount" class="ms-1"></span></button>
        <small id="listCount" class="text-muted ms-auto"></small>
      </div>
      <div id="confirm" class="alert alert-danger d-none flex-shrink-0 align-items-center gap-2" role="alertdialog" aria-labelledby="confirmText">
        <span id="confirmText" class="me-auto"></span>
        <button id="confirmYes" type="button" class="btn btn-danger btn-sm">Delete permanently</button>
        <button id="confirmNo" type="button" class="btn btn-outline-secondary btn-sm">Cancel</button>
      </div>
      <div id="listError" class="alert alert-danger py-2 small d-none flex-shrink-0" role="alert"></div>
      <div class="flex-fill overflow-auto" style="min-height:0">
        <table class="table table-hover table-sm align-middle list-table mb-2">
          <thead><tr>
            <th scope="col" style="width:2rem"><input id="selectAll" class="form-check-input" type="checkbox" aria-label="Select all loaded messages"></th>
            <th scope="col">Received</th><th scope="col">To</th><th scope="col">From</th><th scope="col">Subject</th><th scope="col" class="text-end">Size</th><th scope="col" style="width:2rem"></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div id="empty" class="text-center text-muted py-4 d-none">No messages.</div>
        <div class="text-center pb-4"><button id="more" type="button" class="btn btn-outline-secondary d-none">Load more</button></div>
      </div>
    </div>

    <div id="viewPane" class="d-none flex-fill overflow-auto pb-5" style="min-height:0"></div>
  </main>
</div>

<script type="module">
import PostalMime from "/vendor/postal-mime.js";
const $ = (selector, root = document) => root.querySelector(selector);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") el.className = value;
    else if (key.startsWith("on")) el[key] = value;
    else if (value !== false && value != null) el.setAttribute(key, value === true ? "" : value);
  }
  el.append(...kids.flat().filter((kid) => kid != null && kid !== false));
  return el;
};
const icon = (name, extra = "") => h("i", { class: `bi bi-${name} ${extra}`.trim() });
const INLINE_IMAGE_BYTES = 8_000_000;
const RAW_PREVIEW_BYTES = 2_000_000;
const BLOCK_SELECTOR = "p, div, tr, li, ul, ol, table, blockquote, section, h1, h2, h3, h4, h5, h6, hr, pre";

let rows = [];
let next = null;
let query = "";
let selected = new Set();
let loading = false;
let opened = null;
let tab = "text";

const size = (bytes) => (bytes < 1000 ? `${bytes} B` : bytes < 1e6 ? `${(bytes / 1e3).toFixed(1)} kB` : bytes < 1e9 ? `${(bytes / 1e6).toFixed(1)} MB` : `${(bytes / 1e9).toFixed(2)} GB`);
const stamp = (iso) => (iso ? new Date(iso).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "none");
const who = (p) => (p?.Name ? `${p.Name} <${p.Address}>` : p?.Address ?? "");
const show = (el, on) => { el.classList.toggle("d-none", !on); };

function ago(iso) {
  if (!iso) return "none";
  const minutes = (Date.now() - new Date(iso).getTime()) / 60000;
  if (minutes < 1) return "just now";
  if (minutes < 90) return `${Math.round(minutes)} min ago`;
  if (minutes < 2160) return `${Math.round(minutes / 60)} h ago`;
  return `${Math.round(minutes / 1440)} days ago`;
}

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch(path, {
    method,
    headers: method === "GET" ? {} : { "Content-Type": "application/json", "X-Admin": "1" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  if (res.status === 401 && path !== "/api/admin/login") {
    showLogin();
    throw new Error("401");
  }
  return res;
}

function showLogin(message = "") {
  rows = [];
  opened = null;
  show($("#app"), false);
  show($("#logout"), false);
  show($("#login"), true);
  const err = $("#loginError");
  err.textContent = message;
  show(err, Boolean(message));
  $("#password").focus();
}

function showApp() {
  show($("#login"), false);
  show($("#app"), true);
  show($("#logout"), true);
}

function statCard(label, value, extra) {
  return h("div", { class: "col-6 col-lg" }, h("div", { class: "border rounded p-2 h-100" },
    h("div", { class: "stat-label text-muted" }, label), h("div", { class: "fw-semibold" }, value), extra));
}

function renderStats(s) {
  const cap = s.storedBytesCap;
  const percent = cap ? Math.min(100, (s.storedBytes / cap) * 100) : null;
  const bar = percent === null ? null : h("div", { class: "progress mt-1", style: "height:.4rem", role: "progressbar", "aria-label": "Stored bytes against the cap", "aria-valuenow": Math.round(percent), "aria-valuemin": "0", "aria-valuemax": "100" },
    h("div", { class: `progress-bar${percent > 90 ? " bg-danger" : ""}`, style: `width:${percent}%` }));
  $("#stats").replaceChildren(
    statCard("Messages", String(s.messages)),
    statCard("Stored mail", cap ? `${size(s.storedBytes)} of ${size(cap)}` : size(s.storedBytes), bar),
    statCard("D1 database", s.d1SizeBytes == null ? "unknown" : size(s.d1SizeBytes)),
    statCard("Last ingest", ago(s.lastIngestAt)),
    statCard("Oldest message", stamp(s.oldestAt)));
}

async function loadStats() {
  try { renderStats(await (await api("/api/admin/stats")).json()); } catch {}
}

function renderRows() {
  const body = rows.map((m) => {
    const to = m.to.length > 1 ? `${m.to[0]} +${m.to.length - 1}` : (m.to[0] ?? "");
    const box = h("input", { class: "form-check-input", type: "checkbox", "aria-label": `Select ${m.subject || "message"}`, onclick: (e) => e.stopPropagation(), onchange: () => { box.checked ? selected.add(m.id) : selected.delete(m.id); syncSelection(); } });
    box.checked = selected.has(m.id);
    return h("tr", { "data-open": m.id, "data-subject": m.subject, onclick: () => { location.hash = `#/m/${m.id}`; } },
      h("td", { onclick: (e) => e.stopPropagation() }, box),
      h("td", { class: "text-nowrap small" }, stamp(m.created)),
      h("td", { class: "cell-clip small", title: m.to.join(", ") }, to),
      h("td", { class: "cell-clip small", title: who(m.from) }, m.from.Address),
      h("td", { class: "cell-clip" }, m.subject || "(no subject)"),
      h("td", { class: "text-end small text-nowrap" }, size(m.size)),
      h("td", {}, m.attachments ? icon("paperclip", "text-muted") : null));
  });
  $("#rows").replaceChildren(...body);
  show($("#empty"), !rows.length && !loading);
  show($("#more"), next !== null);
  $("#listCount").textContent = rows.length ? `${rows.length} loaded${next !== null ? ", more available" : ""}` : "";
  syncSelection();
}

function syncSelection() {
  const loadedIds = new Set(rows.map((m) => m.id));
  for (const id of selected) if (!loadedIds.has(id)) selected.delete(id);
  $("#selectedCount").textContent = selected.size ? `(${selected.size})` : "";
  $("#deleteSelected").disabled = selected.size === 0;
  const all = $("#selectAll");
  all.checked = rows.length > 0 && selected.size === rows.length;
  all.indeterminate = selected.size > 0 && selected.size < rows.length;
}

async function loadList(more = false) {
  if (loading) return;
  loading = true;
  show($("#listError"), false);
  try {
    const params = new URLSearchParams();
    if (query) params.set("q", query);
    if (more && next !== null) params.set("before", String(next));
    const res = await api(`/api/admin/messages?${params}`);
    if (!res.ok) throw new Error(String(res.status));
    const body = await res.json();
    rows = more ? [...rows, ...body.messages] : body.messages;
    next = body.next;
  } catch (err) {
    if (err.message !== "401") {
      $("#listError").textContent = "Could not load the list. Try Refresh.";
      show($("#listError"), true);
    }
  } finally {
    loading = false;
    renderRows();
  }
}

function askDelete(ids) {
  $("#confirmText").textContent = `Delete ${ids.length} message${ids.length === 1 ? "" : "s"} permanently? This cannot be undone.`;
  const bar = $("#confirm");
  bar.dataset.ids = JSON.stringify(ids);
  bar.classList.remove("d-none");
  bar.classList.add("d-flex");
  $("#confirmNo").focus();
}

function closeConfirm() {
  const bar = $("#confirm");
  bar.classList.add("d-none");
  bar.classList.remove("d-flex");
  delete bar.dataset.ids;
}

async function runDelete() {
  const ids = JSON.parse($("#confirm").dataset.ids ?? "[]");
  closeConfirm();
  if (!ids.length) return;
  try {
    for (let at = 0; at < ids.length; at += 100) {
      const res = await api("/api/admin/delete", { method: "POST", body: { ids: ids.slice(at, at + 100) } });
      if (!res.ok) throw new Error(String(res.status));
    }
  } catch (err) {
    if (err.message !== "401") { $("#listError").textContent = "Delete failed. Nothing more was removed."; show($("#listError"), true); }
  }
  ids.forEach((id) => selected.delete(id));
  if (opened) location.hash = "#/";
  await Promise.all([loadList(), loadStats()]);
}

const flat = (list) => (list ?? []).flatMap((p) => (p.group ? flat(p.group) : [{ Name: p.name ?? "", Address: p.address ?? "" }]));

const dataUrl = (blob) => new Promise((resolve) => {
  const reader = new FileReader();
  reader.onload = () => resolve(reader.result);
  reader.readAsDataURL(blob);
});

async function inlineImages(html, files) {
  let budget = INLINE_IMAGE_BYTES;
  let out = html;
  for (const f of files) {
    if (!f.contentId || !/^image\//.test(f.mimeType) || f.content.byteLength > budget) continue;
    budget -= f.content.byteLength;
    out = out.split(`cid:${f.contentId.replace(/^<|>$/g, "")}`).join(await dataUrl(new Blob([f.content], { type: f.mimeType })));
  }
  return out;
}

function htmlToText(html) {
  if (!html) return "";
  const doc = new DOMParser().parseFromString(html, "text/html");
  doc.querySelectorAll("head, style, script, template, noscript").forEach((el) => el.remove());
  doc.querySelectorAll("br").forEach((el) => el.replaceWith("\n"));
  doc.querySelectorAll("td, th").forEach((el) => el.append(" "));
  doc.querySelectorAll(BLOCK_SELECTOR).forEach((el) => el.append("\n"));
  return doc.body.textContent.split("\n").map((line) => line.replace(/[ \t ]+/g, " ").trim()).join("\n").replace(/\n{3,}/g, "\n\n").trim();
}

async function parseMessage(id, raw) {
  const parsed = await PostalMime.parse(raw);
  const files = parsed.attachments ?? [];
  const groups = new Map();
  for (const header of parsed.headers ?? []) groups.set(header.originalKey, [...(groups.get(header.originalKey) ?? []), header.value]);
  return {
    id,
    from: parsed.from ? flat([parsed.from])[0] : null,
    to: flat(parsed.to),
    cc: flat(parsed.cc),
    subject: parsed.subject ?? "",
    date: parsed.date && !Number.isNaN(Date.parse(parsed.date)) ? new Date(parsed.date).toISOString() : null,
    html: parsed.html ? await inlineImages(parsed.html, files) : "",
    text: parsed.text || htmlToText(parsed.html),
    attachments: files.filter((f) => !f.related).map((f) => ({ fileName: f.filename, contentType: f.mimeType, size: f.content.byteLength, content: f.content })),
    headers: [...groups],
    raw,
  };
}

function saveBlob(blob, fileName) {
  const a = h("a", { href: URL.createObjectURL(blob), download: fileName || "attachment" });
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

function headerRow(label, content) {
  return h("tr", { class: "small" }, h("th", { class: "pe-3 text-nowrap align-top" }, label), h("td", { class: "text-break" }, content));
}

function renderMessage() {
  const m = opened;
  const listed = rows.find((r) => r.id === m.id);
  const tabs = [m.html ? ["html", "HTML"] : null, ["text", "Text"], ["headers", "Headers"], ["attachments", `Attachments (${m.attachments.length})`]].filter(Boolean);
  if (!tabs.some(([id]) => id === tab)) tab = tabs[0][0];
  const addrs = (list) => list.map((p) => who(p)).join(", ");
  const pane = h("div", { class: "tab-content mb-4" });
  if (tab === "html") {
    const frame = h("iframe", { id: "preview", sandbox: "allow-popups allow-popups-to-escape-sandbox", referrerpolicy: "no-referrer", title: "Message HTML" });
    frame.srcdoc = "<meta http-equiv=\"Content-Security-Policy\" content=\"default-src 'none'; style-src 'unsafe-inline'; img-src https: data:\"><base target=\"_blank\"><style>:root{color-scheme:light}body{background:#fff;color:#000}</style>" + m.html;
    pane.append(frame);
  } else if (tab === "text") {
    pane.append(h("pre", { class: "text-body", style: "white-space:pre-wrap;word-break:break-word;font-family:inherit" }, m.text || "(empty)"));
  } else if (tab === "headers") {
    const clipped = m.raw.byteLength > RAW_PREVIEW_BYTES;
    const head = new TextDecoder().decode(new Uint8Array(m.raw, 0, Math.min(m.raw.byteLength, RAW_PREVIEW_BYTES)));
    const end = head.search(/\r?\n\r?\n/);
    pane.append(
      clipped ? h("p", { class: "text-muted small" }, `Showing the first ${size(RAW_PREVIEW_BYTES)} of ${size(m.raw.byteLength)}.`) : null,
      h("pre", { class: "small text-body", "data-raw-head": true }, end === -1 ? head : head.slice(0, end)));
  } else {
    pane.append(m.attachments.length
      ? h("div", { class: "list-group" }, m.attachments.map((f) => h("a", { href: "#", class: "list-group-item list-group-item-action d-flex justify-content-between", onclick: (e) => { e.preventDefault(); saveBlob(new Blob([f.content], { type: f.contentType }), f.fileName); } },
        h("span", { class: "text-break" }, icon("paperclip", "me-2"), f.fileName || "attachment"), h("small", { class: "text-muted ms-3 text-nowrap" }, `${f.contentType}, ${size(f.size)}`))))
      : h("p", { class: "text-muted" }, "No attachments."));
  }
  $("#viewPane").replaceChildren(h("div", { class: "py-3" },
    h("div", { class: "d-flex flex-wrap gap-2 mb-3" },
      h("a", { href: "#/", id: "back", class: "btn btn-outline-secondary" }, icon("arrow-return-left", "me-1"), "Back"),
      h("button", { type: "button", id: "download", class: "btn btn-outline-secondary", onclick: () => saveBlob(new Blob([m.raw], { type: "message/rfc822" }), "message.eml") }, icon("file-arrow-down-fill", "me-1"), "Download .eml"),
      h("button", { type: "button", id: "deleteOne", class: "btn btn-outline-danger ms-auto", onclick: () => askDelete([m.id]) }, icon("trash-fill", "me-1"), "Delete")),
    h("table", { class: "mb-3" }, h("tbody", {},
      headerRow("From", who(m.from)),
      headerRow("To", addrs(m.to)),
      listed ? headerRow("Delivered to", listed.to.join(", ")) : null,
      m.cc.length ? headerRow("Cc", addrs(m.cc)) : null,
      headerRow("Subject", h("strong", {}, m.subject || "(no subject)")),
      headerRow("Date", `${stamp(m.date ?? listed?.created)} (${size(m.raw.byteLength)})`))),
    h("nav", { class: "nav nav-tabs mb-3", role: "tablist" }, tabs.map(([id, label]) => h("button", { class: `nav-link${tab === id ? " active" : ""}`, type: "button", role: "tab", "data-tab": id, onclick: () => { tab = id; renderMessage(); } }, label))),
    pane));
}

async function openMessage(id) {
  show($("#listPane"), false);
  show($("#viewPane"), true);
  $("#viewPane").replaceChildren(h("p", { class: "text-muted py-4" }, "Loading..."));
  try {
    const res = await api(`/api/admin/messages/${encodeURIComponent(id)}/raw`);
    if (!res.ok) throw new Error(String(res.status));
    const raw = await res.arrayBuffer();
    if (location.hash !== `#/m/${id}`) return;
    opened = await parseMessage(id, raw);
    tab = opened.html ? "html" : "text";
    renderMessage();
  } catch (err) {
    if (err.message !== "401") $("#viewPane").replaceChildren(h("div", { class: "py-3" }, h("a", { href: "#/", class: "btn btn-outline-secondary mb-3" }, "Back"), h("div", { class: "alert alert-danger" }, "Could not open this message. It may have been deleted.")));
  }
}

function route() {
  const match = /^#\/m\/([A-Za-z0-9_-]{1,64})$/.exec(location.hash);
  if (!$("#app").classList.contains("d-none") && match) return openMessage(match[1]);
  opened = null;
  show($("#viewPane"), false);
  show($("#listPane"), true);
}

async function start() {
  try {
    const res = await api("/api/admin/stats");
    if (res.status === 404) return showLogin("The admin area is not enabled.");
    if (!res.ok) return showLogin("The admin service is unavailable.");
    renderStats(await res.json());
  } catch { return; }
  showApp();
  await loadList();
  route();
}

$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = $("#loginGo");
  button.disabled = true;
  try {
    const res = await api("/api/admin/login", { method: "POST", body: { password: $("#password").value } });
    $("#password").value = "";
    if (res.ok) return await start();
    showLogin(res.status === 429 ? "Too many failed attempts. Try again in 10 minutes." : res.status === 404 ? "The admin area is not enabled." : "Wrong password.");
  } catch { showLogin("Could not reach the server."); } finally { button.disabled = false; }
});

$("#logout").addEventListener("click", async () => {
  try { await api("/api/admin/logout", { method: "POST", body: {} }); } catch {}
  selected = new Set();
  location.hash = "#/";
  showLogin();
});

$("#searchForm").addEventListener("submit", (e) => { e.preventDefault(); query = $("#search").value.trim(); selected = new Set(); loadList(); });
$("#refresh").addEventListener("click", () => { Promise.all([loadList(), loadStats()]); });
$("#more").addEventListener("click", () => loadList(true));
$("#selectAll").addEventListener("change", (e) => { selected = e.target.checked ? new Set(rows.map((m) => m.id)) : new Set(); renderRows(); });
$("#deleteSelected").addEventListener("click", () => askDelete([...selected]));
$("#confirmYes").addEventListener("click", runDelete);
$("#confirmNo").addEventListener("click", closeConfirm);
addEventListener("hashchange", route);
start();
</script>
</body>
</html>
